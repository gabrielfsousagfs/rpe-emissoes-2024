name: Extrair Emissões 2024

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install playwright
          playwright install chromium

      - name: Rodar script
        run: python -u extrair_emissoes_2024.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: emissoes-2024
          path: emissoes_2024.csv
