name: Extrair Emissões 2024

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pandas openpyxl curl_cffi

      - name: Run script
        run: python -u extrair_emissoes_2024.py

      - name: Upload resultado
        uses: actions/upload-artifact@v4
        with:
          name: emissoes-2024
          path: emissoes_2024.xlsx
